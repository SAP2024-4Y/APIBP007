openapi: 3.0.3
info:
  title: DineIndia
  version: 1.0.0
  description: DineIndia reservation API. Obtain a JWT from Authentication, then click
    Authorize and paste the token without the Bearer prefix. Public reads require
    no token. Admin manages restaurants and slots; customers manage their own bookings.
paths:
  /health:
    get:
      summary: Health
      operationId: get_health
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: &id001
                    type: string
                required:
                - status
        '400':
          description: BAD_INPUT, INVALID_CURSOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                BAD_INPUT:
                  value:
                    code: BAD_INPUT
                    message: Bad Input
                INVALID_CURSOR:
                  value:
                    code: INVALID_CURSOR
                    message: Invalid Cursor
        '401':
          description: UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  value:
                    code: UNAUTHENTICATED
                    message: Unauthenticated
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                FORBIDDEN:
                  value:
                    code: FORBIDDEN
                    message: Forbidden
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                NOT_FOUND:
                  value:
                    code: NOT_FOUND
                    message: Not Found
        '409':
          description: CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CONFLICT:
                  value:
                    code: CONFLICT
                    message: Conflict
        '422':
          description: INVALID_WINDOW, INVALID_LOCATION, INVALID_PRICE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_WINDOW:
                  value:
                    code: INVALID_WINDOW
                    message: Invalid Window
                INVALID_LOCATION:
                  value:
                    code: INVALID_LOCATION
                    message: Invalid Location
                INVALID_PRICE:
                  value:
                    code: INVALID_PRICE
                    message: Invalid Price
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                RATE_LIMITED:
                  value:
                    code: RATE_LIMITED
                    message: Rate Limited
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INTERNAL_ERROR:
                  value:
                    code: INTERNAL_ERROR
                    message: Internal Error
      tags:
      - Health
