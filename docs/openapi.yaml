components:
  schemas:
    Restaurant:
      type: object
      properties:
        id: *id004
        name: *id001
        city: *id001
        category: *id001
        status: *id001
        price: *id004
        latitude: *id002
        longitude: *id002
        location:
          type: object
          properties:
            type: *id001
            coordinates:
              type: array
              items: *id002
          required:
          - type
          - coordinates
      required:
      - id
      - name
      - city
      - category
      - status
      - price
      - latitude
      - longitude
      - location
    Slot:
      type: object
      properties:
        id: *id004
        restaurant_id: *id004
        starts_at: *id001
        ends_at: *id001
        available: &id008
          type: boolean
      required:
      - id
      - restaurant_id
      - starts_at
      - ends_at
      - available
    Booking:
      type: object
      properties:
        id: *id004
        slot_id: *id004
        username: *id001
      required:
      - id
      - slot_id
      - username
    Error:
      type: object
      properties:
        code:
          type: string
          enum:
          - BAD_INPUT
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - CONFLICT
          - INVALID_WINDOW
          - INVALID_CURSOR
          - INVALID_LOCATION
          - INVALID_PRICE
          - RATE_LIMITED
          - INTERNAL_ERROR
        message: *id001
      required:
      - code
      - message
    List:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Restaurant'
        edges:
          type: array
          items:
            type: object
            properties:
              node:
                $ref: '#/components/schemas/Restaurant'
              cursor: *id001
            required:
            - node
            - cursor
        has_more: *id008
        after:
          type: string
          nullable: true
        pageInfo:
          type: object
          properties:
            hasNextPage: *id008
            endCursor:
              type: string
              nullable: true
          required:
          - hasNextPage
          - endCursor
      required:
      - items
      - edges
      - has_more
      - after
      - pageInfo
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Health
- name: Authentication
- name: Restaurants
- name: Map Search
- name: Calendar & Slots
- name: Bookings
- name: Admin Restaurant Management
